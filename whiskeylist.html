<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Whisky Archive - 대표 30선</title>
<style>
  :root{
    --bg:#11100e; --panel:#1b1915; --panel2:#242018; --line:#3c3428;
    --gold:#d6ad60; --gold2:#f1d18f; --text:#f4efe6; --muted:#b9ad9b;
    --green:#80b192; --red:#c8796b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:linear-gradient(160deg,#0e0d0b,#19150f 65%,#0c0b09);color:var(--text);min-height:100vh}
  button,input,select{font:inherit}
  .wrap{max-width:1240px;margin:auto;padding:24px}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 0 24px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:13px}
  .logo{width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:24px;background:#201b14}
  h1{font-family:Georgia,serif;font-weight:500;letter-spacing:.8px;margin:0;font-size:28px}
  .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .stats{display:flex;gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;text-align:center;min-width:78px}
  .stat b{display:block;color:var(--gold2);font-size:18px}
  .stat span{font-size:11px;color:var(--muted)}
  .search{margin:25px 0 18px;padding:20px;background:rgba(27,25,21,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px #0005}
  .search-grid{display:grid;grid-template-columns:1fr 1fr 1fr 2fr auto;gap:12px}
  label{font-size:12px;color:var(--muted);display:block;margin:0 0 7px 2px}
  select,input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #4b4133;background:#14120f;color:var(--text);outline:none}
  select:focus,input:focus{border-color:var(--gold)}
  .search-btn{align-self:end;height:43px;border:0;border-radius:10px;padding:0 22px;background:linear-gradient(135deg,var(--gold),#a97928);color:#18130c;font-weight:bold;cursor:pointer}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 2px}
  .toolbar h2{font-size:18px;margin:0;font-weight:600}
  .toolbar small{color:var(--muted)}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 11px;border-radius:999px;cursor:pointer}
  .chip.active{border-color:var(--gold);color:var(--gold2);background:#2a2114}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .card{background:linear-gradient(165deg,#211e19,#171512);border:1px solid var(--line);border-radius:17px;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
  .card:hover{transform:translateY(-4px);border-color:#7d6339;box-shadow:0 16px 35px #0008}
  .visual{height:210px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 30%,#4b3920,#17130e 65%)}
  .bottle{width:72px;height:145px;border:2px solid #c7a66b80;border-radius:12px 12px 17px 17px;background:linear-gradient(90deg,#553316,#a26725 48%,#4b2b12);box-shadow:0 15px 25px #0009;position:relative}
  .bottle:before{content:"";position:absolute;width:30px;height:35px;left:19px;top:-31px;border:2px solid #c7a66b80;border-bottom:0;border-radius:5px 5px 0 0;background:#3c2b1b}
  .label{position:absolute;left:7px;right:7px;top:45px;background:#e9dfc8;color:#251b10;padding:12px 3px;text-align:center;font-family:Georgia,serif;font-size:12px;border:1px solid #b99c64}
  .badge{position:absolute;top:13px;right:13px;background:#10100ddd;border:1px solid #ffffff22;border-radius:999px;padding:6px 9px;font-size:11px;color:var(--gold2)}
  .card-body{padding:16px}
  .card h3{font-family:Georgia,serif;font-size:20px;margin:0 0 6px}
  .meta{font-size:13px;color:var(--muted);margin-bottom:13px}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;background:#2d281f;border:1px solid #453b2d;padding:5px 7px;border-radius:7px;color:#cfbfaa}
  .tasted{position:absolute;top:13px;left:13px;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;background:#15120eee;border:1px solid #ffffff25;font-size:15px}
  .tasted.yes{background:#234433;color:#bff1ce;border-color:#47765a}
  .empty{text-align:center;padding:70px 20px;color:var(--muted);grid-column:1/-1;border:1px dashed var(--line);border-radius:16px}
  dialog{width:min(920px,94vw);max-height:90vh;border:1px solid #66553b;border-radius:18px;background:#171512;color:var(--text);padding:0;box-shadow:0 30px 80px #000c}
  dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
  .modal-head{display:flex;justify-content:space-between;gap:15px;padding:24px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#292117,#171512)}
  .modal-title h2{font-family:Georgia,serif;font-size:30px;margin:0 0 6px;color:var(--gold2)}
  .modal-title p{margin:0;color:var(--muted)}
  .close{border:1px solid var(--line);background:#171512;color:#ddd;width:38px;height:38px;border-radius:50%;cursor:pointer}
  .modal-body{padding:24px;overflow:auto;max-height:calc(90vh - 105px)}
  .detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .info-box{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}
  .info-box span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
  .info-box b{font-size:15px;color:#f1e7d5}
  .section{margin:22px 0}
  .section h3{font-size:16px;color:var(--gold2);margin:0 0 10px;border-left:3px solid var(--gold);padding-left:9px}
  .section p,.section li{line-height:1.75;color:#d9cfc0;font-size:14px}
  .variants{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .variant{background:#211d17;border:1px solid var(--line);border-radius:10px;padding:12px}
  .variant b{display:block;color:#ead5ad;margin-bottom:5px}
  .variant span{font-size:12px;color:var(--muted)}
  .taste-panel{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#232019;border:1px solid #4a4032;border-radius:13px;padding:14px;margin-top:22px}
  .taste-panel button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer;background:var(--green);color:#102117}
  .taste-panel button.off{background:#6f6252;color:#fff}
  .note{font-size:12px;color:#998c7b;margin-top:22px;padding-top:15px;border-top:1px dashed var(--line)}
  @media(max-width:900px){.search-grid{grid-template-columns:1fr 1fr}.search-btn{grid-column:span 2}.grid{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.wrap{padding:14px}.stats{display:none}.search-grid{grid-template-columns:1fr}.search-btn{grid-column:auto}.grid{grid-template-columns:1fr}.variants{grid-template-columns:1fr}.toolbar{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🥃</div>
      <div><h1>Whisky Archive</h1><div class="sub">정적 위스키 도감 · 문화 · 역사 · 나의 시음 기록</div></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="allCount">0</b><span>전체 위스키</span></div>
      <div class="stat"><b id="tastedCount">0</b><span>마셔본 위스키</span></div>
    </div>
  </header>

  <section class="search">
    <div class="search-grid">
      <div><label>위스키 종류</label><select id="type"><option value="">전체</option></select></div>
      <div><label>국가</label><select id="country"><option value="">전체</option></select></div>
      <div><label>지역</label><select id="region"><option value="">전체</option></select></div>
      <div><label>위스키명</label><input id="keyword" placeholder="예: Macallan, Yamazaki, 발베니" /></div>
      <button class="search-btn" onclick="render()">검색</button>
    </div>
  </section>

  <div class="toolbar">
    <div><h2>검색 결과</h2><small id="resultText"></small></div>
    <div class="filters">
      <button class="chip active" data-view="all">전체</button>
      <button class="chip" data-view="tasted">마셔봄</button>
      <button class="chip" data-view="untasted">아직 안 마셔봄</button>
    </div>
  </div>

  <main class="grid" id="list"></main>
</div>

<dialog id="detailDialog">
  <div id="detail"></div>
</dialog>
